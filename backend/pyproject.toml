[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-provide"
version = "0.1.0"
description = "学習したモデルで新しいデータを推論し, 予測から結論を出すローカルの Web アプリ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    # 一式を作る画面でファイルの組のデータセットの項目を読む (load_items)
    "ml-eda",
    "ml-inference[all]",
    "ml-quest",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # ML-Inference が使う. Linux では下の pytorch-cpu から取る
    "torch>=2.2",
    "uvicorn>=0.32"
]

[project.scripts]
ml-provide = "ml_provide.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0"
]

[tool.uv.sources]
ml-eda = { git = "https://github.com/victor-von-pooh/ML-EDA.git" }
ml-inference = { path = "../ML-Inference", editable = true }
ml-quest = { path = "../ML-Quest", editable = true }
# Linux (CI) では CUDA の無い軽い PyTorch を使う
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/ml_provide"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
